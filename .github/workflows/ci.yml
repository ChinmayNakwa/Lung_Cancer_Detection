name: CI - Build and Test

on:
  push:
    branches: [ "main", "ml-pipeline" ]
  pull_request:
    branches: [ "main", "ml-pipeline" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true # sample test images are stored in Git LFS

      # Matches the Python version in backend/Dockerfile
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Tests needing the model file or Postgres skip themselves when those are absent
      - name: Run tests with pytest
        run: pytest -rs
