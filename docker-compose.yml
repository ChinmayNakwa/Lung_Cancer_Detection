services:
  postgres:
    image: postgres:15
    container_name: lung-cancer-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lung-cancer-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    container_name: lung-cancer-mlflow
    ports:
      - "5001:5000"
    volumes:
      - mlflow_data:/mlflow
    # Upgrade the schema first so volumes created by older MLflow versions keep working.
    # Experiments created with the old plain-path artifact root made clients write
    # artifacts inside their own containers; point them at the proxied store instead.
    # Artifacts are uploaded through the server and stored on the mlflow_data volume.
    # MLflow 3 rejects unknown Host headers, so allow the compose service name too.
    command:
      - sh
      - -c
      - >-
        mlflow db upgrade sqlite:///mlflow/mlflow.db &&
        python -c "import sqlite3; c = sqlite3.connect('/mlflow/mlflow.db');
        c.execute(\"UPDATE experiments SET artifact_location = 'mlflow-artifacts:' || substr(artifact_location, 18)
        WHERE artifact_location LIKE '/mlflow/artifacts/%'\"); c.commit()" &&
        exec mlflow server
        --host 0.0.0.0
        --port 5000
        --workers 1
        --backend-store-uri sqlite:///mlflow/mlflow.db
        --artifacts-destination /mlflow/artifacts
        --serve-artifacts
        --allowed-hosts mlflow:5000,localhost:5000,localhost:5001

    healthcheck:
      # The image has Python but not curl; /health returns 200 once the server is up
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lung-cancer-api
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - model_data:/app/models
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MLFLOW_TRACKING_URI: http://mlflow:5000
      IMG_SIZE: ${IMG_SIZE}
      RETRAIN_THRESHOLD: ${RETRAIN_THRESHOLD}
      EPOCHS: ${EPOCHS}
      BATCH_SIZE: ${BATCH_SIZE}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lung-cancer-celery
    volumes:
      - ./backend:/app
      - model_data:/app/models
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MLFLOW_TRACKING_URI: http://mlflow:5000
      IMG_SIZE: ${IMG_SIZE}
      RETRAIN_THRESHOLD: ${RETRAIN_THRESHOLD}
      EPOCHS: ${EPOCHS}
      BATCH_SIZE: ${BATCH_SIZE}
      HOLDOUT_FRACTION: ${HOLDOUT_FRACTION:-0.2}
      MIN_HOLDOUT_SAMPLES: ${MIN_HOLDOUT_SAMPLES:-20}
      TF_NUM_INTEROP_THREADS: 1
      TF_NUM_INTRAOP_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info --pool=solo --concurrency=1

volumes:
  postgres_data:
  mlflow_data:
  model_data: